<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Deep precision steel-slate squircle -->
    <linearGradient id="sf-bg" x1="12%" y1="6%" x2="88%" y2="94%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="52%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#090D16"/>
    </linearGradient>
    <!-- Top specular rim -->
    <linearGradient id="sf-rim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#93C5FD" stop-opacity="0.32"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.02"/>
    </linearGradient>
    <!-- Forge cobalt ambient glow -->
    <radialGradient id="sf-glow" cx="50%" cy="28%" r="60%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>
    <!-- Crisp metallic cube top facet -->
    <linearGradient id="sf-top" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
    <!-- Blueprint cobalt left facet -->
    <linearGradient id="sf-left" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <!-- Molten forge amber launch spark / right facet -->
    <linearGradient id="sf-amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="55%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <filter id="sf-shadow" x="-16%" y="-16%" width="132%" height="132%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#020617" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- Squircle container -->
  <rect x="20" y="20" width="472" height="472" rx="112" fill="url(#sf-bg)"/>
  <rect x="20" y="20" width="472" height="472" rx="112" fill="url(#sf-glow)"/>
  <rect x="23" y="23" width="466" height="466" rx="109" fill="none" stroke="url(#sf-rim)" stroke-width="5"/>

  <!-- Subtle blueprint construction ring -->
  <circle cx="256" cy="256" r="176" fill="none" stroke="#93C5FD" stroke-opacity="0.10" stroke-width="2" stroke-dasharray="8 10"/>

  <!-- Isometric Forged Package & Upward Ship Chevron -->
  <g filter="url(#sf-shadow)">
    <!-- Lower left package wall (Cobalt) -->
    <path d="M 134 226 L 246 290 L 246 404 L 134 340 Z" fill="url(#sf-left)" stroke="#60A5FA" stroke-opacity="0.35" stroke-width="2" stroke-linejoin="round"/>
    <!-- Lower right package wall (Slate) -->
    <path d="M 378 226 L 266 290 L 266 404 L 378 340 Z" fill="#1E293B" stroke="#94A3B8" stroke-opacity="0.32" stroke-width="2" stroke-linejoin="round"/>
    <!-- Inner forged highlight strip on right wall -->
    <path d="M 290 302 L 354 265 L 354 295 L 290 332 Z" fill="url(#sf-amber)" opacity="0.92"/>
    <!-- Top diamond lid split into precision chevron (Silver-white) -->
    <path d="M 256 106 L 378 176 L 332 202 L 256 158 L 180 202 L 134 176 Z" fill="url(#sf-top)"/>
    <!-- Upward forge launch core (Amber-gold diamond arrow) -->
    <path d="M 256 174 L 322 212 L 256 250 L 190 212 Z" fill="url(#sf-amber)"/>
  </g>
</svg>
