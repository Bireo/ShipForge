<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Deep obsidian-pine squircle -->
    <linearGradient id="sf-bg" x1="12%" y1="6%" x2="88%" y2="94%">
      <stop offset="0%" stop-color="#132523"/>
      <stop offset="52%" stop-color="#0C1716"/>
      <stop offset="100%" stop-color="#070E0D"/>
    </linearGradient>
    <!-- Top specular mineral rim -->
    <linearGradient id="sf-rim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5EEAD4" stop-opacity="0.34"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.02"/>
    </linearGradient>
    <!-- Forged emerald-teal ambient glow -->
    <radialGradient id="sf-glow" cx="50%" cy="28%" r="60%">
      <stop offset="0%" stop-color="#14B8A6" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#14B8A6" stop-opacity="0"/>
    </radialGradient>
    <!-- Brushed titanium cube top facet -->
    <linearGradient id="sf-top" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#F7FAF9"/>
      <stop offset="100%" stop-color="#C8DBD6"/>
    </linearGradient>
    <!-- Forged emerald-teal left facet -->
    <linearGradient id="sf-left" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14B8A6"/>
      <stop offset="100%" stop-color="#0F766E"/>
    </linearGradient>
    <!-- Warm forged brass launch spark / right highlight -->
    <linearGradient id="sf-brass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="55%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <filter id="sf-shadow" x="-16%" y="-16%" width="132%" height="132%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#030908" flood-opacity="0.58"/>
    </filter>
  </defs>

  <!-- Squircle container -->
  <rect x="20" y="20" width="472" height="472" rx="112" fill="url(#sf-bg)"/>
  <rect x="20" y="20" width="472" height="472" rx="112" fill="url(#sf-glow)"/>
  <rect x="23" y="23" width="466" height="466" rx="109" fill="none" stroke="url(#sf-rim)" stroke-width="5"/>

  <!-- Subtle blueprint construction ring -->
  <circle cx="256" cy="256" r="176" fill="none" stroke="#5EEAD4" stroke-opacity="0.12" stroke-width="2" stroke-dasharray="8 10"/>

  <!-- Isometric Forged Package & Upward Ship Chevron -->
  <g filter="url(#sf-shadow)">
    <!-- Lower left package wall (Forged Emerald-Teal) -->
    <path d="M 134 226 L 246 290 L 246 404 L 134 340 Z" fill="url(#sf-left)" stroke="#5EEAD4" stroke-opacity="0.38" stroke-width="2" stroke-linejoin="round"/>
    <!-- Lower right package wall (Deep Pine Slate) -->
    <path d="M 378 226 L 266 290 L 266 404 L 378 340 Z" fill="#182C29" stroke="#80ABA3" stroke-opacity="0.32" stroke-width="2" stroke-linejoin="round"/>
    <!-- Inner forged brass strip on right wall -->
    <path d="M 290 302 L 354 265 L 354 295 L 290 332 Z" fill="url(#sf-brass)" opacity="0.94"/>
    <!-- Top diamond lid split into precision chevron (Brushed Titanium) -->
    <path d="M 256 106 L 378 176 L 332 202 L 256 158 L 180 202 L 134 176 Z" fill="url(#sf-top)"/>
    <!-- Upward forge launch core (Warm Brass diamond arrow) -->
    <path d="M 256 174 L 322 212 L 256 250 L 190 212 Z" fill="url(#sf-brass)"/>
  </g>
</svg>
