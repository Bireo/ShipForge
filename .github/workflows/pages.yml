name: Deploy Official Website (GitHub Pages)

on:
  push:
    branches: ["main"]
    paths:
      - "website/**"
      - "docs/assets/screenshots/**"
      - "docs/assets/logo.svg"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Assemble static site with runtime screenshots
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p _site/assets/screenshots
          cp -r website/* _site/
          cp -r docs/assets/screenshots/* _site/assets/screenshots/
          cp docs/assets/logo.svg _site/assets/logo.svg
          REV="${GITHUB_SHA::8}"
          sed -i -E "s/(styles\.css|app\.js)(\?v=[^\"']*)?/\1?v=${REV}/g" _site/index.html
          curl -fsSL "https://github.com/${{ github.repository }}/releases/latest/download/latest.json" -o _site/latest.json || true
          STARS=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ github.repository }}" | python3 -c "import sys,json; print(json.load(sys.stdin).get('stargazers_count',0))" 2>/dev/null || echo 0)
          printf '{"stars":%s}\n' "${STARS:-0}" > _site/repo-meta.json
          touch _site/.nojekyll
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
